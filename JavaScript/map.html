<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Map</title>
</head>
<body>
    <script>
        const num=[1,2,3,4,5,6,7,8];
        const even=num.filter((i)=>(i%2==0));
        const square=even.map((i)=>(i*i));
        console.log(square);
    </script>
    
</html>
