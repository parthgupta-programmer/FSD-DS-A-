<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loops</title>
</head>
<body>

    <p id='parent'></p>
    <script>
        // for(let i=1;i<=10;i++){
        //     document.write(i+'<br>');
        // }
        const car=['C1','C2','C3','C4','C5'];
        let text=" ";
        for(let i=0;i<=car.length-1;i++){
            text += car[i] + '<br>';
        }
        document.getElementById('parent').innerHTML=text;
    </script>
    
</body>
</html>
