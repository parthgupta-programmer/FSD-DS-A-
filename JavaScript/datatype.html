<!-- const: A variable cannot be redeclared or reassigned using const. -->

<!-- var: A variable can be redeclared and reassigned; the latest value is used. -->

<!-- let: A variable cannot be redeclared in the same scope, but its value can be reassigned. -->



<!-- In terms of complexity and behavior, you can understand var, let, and const like this:

var → Function-scoped. It can be redeclared and reassigned, which can make code harder to manage in large programs.
let → Block-scoped. It can be reassigned but cannot be redeclared in the same scope, making it safer than var.
const → Block-scoped. It cannot be reassigned or redeclared in the same scope, making it the most restrictive and predictable.

So, in terms of control/restriction:

var < let < const

-->
