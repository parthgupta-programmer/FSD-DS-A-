<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filter</title>
</head>
<body>
    <script>
        const num=[1,2,3,4,5,6,7,8];
        const even=num.filter((i)=>(i%2==0));
        document.write(num+'<br>')
        document.write(even)
    </script>
</body>
</html>
