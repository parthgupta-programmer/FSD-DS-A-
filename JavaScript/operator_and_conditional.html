        let n=prompt('Enter a number: ');

        let temp=n;
        // Armstrong No.
        let sum=0;
        let no_of_digits=0;
        while (n>0){
            let r=n%10;
            no_of_digits+=1;
            let q=Math.floor(n/10);
            n=q;
        }
        n=temp;
        while (n>0){
            let r=n%10;
            sum+=r**no_of_digits;
            let q=Math.floor(n/10);
            n=q;
        }
        document.write('Sum of cube of digits is: '+sum+'<br>');
        if (sum==153){
            document.write(temp+' is an Armstrong number');
        }

    </script>
